name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/viewers/index.js && node --check src/exporters/mindmap.js && node --check sw.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Required files
        run: test -f index.html && test -f styles.css && test -f docs/ARCHITECTURE.md
      - name: Browser smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/glom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary available on runner" >&2
            exit 1
          fi
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
          CHROME_BIN="$CHROME_BIN" node tests/smoke.mjs
